# AI-generated with Claude Code from a human-approved spec and plan; each task independently AI-reviewed; integrated and verified by Lionel Derrick Roxas.
# Static security analysis (GitHub CodeQL) for the backend (Python), frontend (TypeScript), Go helper and workflows.
# Findings appear under the repository's Security → Code scanning tab.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: python, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
          - { language: go, build-mode: manual }
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with: { go-version-file: tools/gohelper/go.mod }
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'go'
        working-directory: tools/gohelper
        run: go build ./...
      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:${{ matrix.language }}" }
