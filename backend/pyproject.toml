# AI-generated with Claude Code from a human-approved spec and plan; each task independently AI-reviewed; integrated and verified by Lionel Derrick Roxas.
[project]
name = "go-coverage-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "groq>=0.30",
  "sse-starlette>=2.1,<3",  # tests/conftest.py touches AppStatus internals; re-check on a major bump
  "python-multipart>=0.0.22",  # form uploads (POST /api/repos/upload)
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.17"]

[tool.ruff]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]  # ruff's long-standing defaults plus flake8-bugbear

[tool.ruff.lint.per-file-ignores]
"tests/test_parallel_writers.py" = ["F811"]  # the `ws` fixture is imported from test_orchestrator and used as a parameter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Go + gohelper; run inside the backend image"]
addopts = "-m 'not integration'"
